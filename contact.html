<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  
  <!-- 1. Pure HTML fallback if JavaScript is disabled (0 = instant) -->
  <meta http-equiv="refresh" content="0; url=https://example.com">
  
  <!-- 2. Instant JavaScript redirect (prevents "Back" button loops) -->
  <script>
    window.location.replace("https://wa.me/94778315058?text=Hi!%20I'd%20like%20to%20know%20more.");
  </script>
</head>
<body>
  <!-- 3. Manual link fallback -->
  <p>If you are not redirected automatically, <a href="https://wa.me/94778315058?text=Hi!%20I'd%20like%20to%20know%20more.">click here</a>.</p>
</body>
</html>
